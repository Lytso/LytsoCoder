name: Build & Publish Release

# Lytso — the arm64 and x86_64 release APKs are built in parallel (two runners at once), then one small job
# publishes both. Wall time = the slower build, not arm64 + x86_64 one after the other.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

jobs:
  build:
    name: Release APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64, chroot, x86_64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # full history: the app's "What's new" page is generated from every commit of version.json
          fetch-depth: 0

      # termux-am (termux/TermuxAm): am.apk is built from it for lytso.code. Only this submodule: the other folders
      # (termux-api, termux-x11, lytsocoder-plugins) are independent Lytso ecosystem submodules.
      - name: Fetch the termux-am submodule
        run: git submodule update --init --depth 1 termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'agy_ide_bridge/go.mod'

      - name: Tune Gradle for CI
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
          PROPS

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 scripts/release_version.py name)
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Restore Keystore from Secret
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || '123456' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'lytsocoder' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || '123456' }}
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          # the x86_64 bridge links through the Android NDK's clang, which the runner has (ANDROID_NDK_HOME)
          if [ "${{ matrix.abi }}" = "x86_64" ]; then
            ./scripts/build_all_apks.sh --release --x86_64
          elif [ "${{ matrix.abi }}" = "chroot" ]; then
            ./scripts/build_all_apks.sh --release --chroot
          else
            ./scripts/build_all_apks.sh --release
          fi

      # R8 mapping of this build, to decode its crash stack traces (retrace)
      - name: Save R8 mapping
        run: |
          SUFFIX=""
          if [ "${{ matrix.abi }}" = "x86_64" ]; then SUFFIX="-x86_64"; elif [ "${{ matrix.abi }}" = "chroot" ]; then SUFFIX="-chroot"; fi
          zip -j "output/LytsoCoder-${{ steps.version.outputs.tag }}${SUFFIX}-mapping.zip" app/build/outputs/mapping/release/mapping.txt

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.abi }}
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 scripts/release_version.py name)
          CHANNEL=$(python3 scripts/release_version.py channel)
          CHANGELOG=$(python3 scripts/release_version.py changelog)
          if [ "$CHANNEL" = "beta" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download both builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: output
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.changelog }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          generate_release_notes: true
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
